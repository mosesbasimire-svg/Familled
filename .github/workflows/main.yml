
name: Construire APK Familled

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    name: Construire l'application Android
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Android SDK
        uses: android-actions/setup-android@v3

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extraire le projet Android
        run: |
          mkdir -p android-project
          unzip -q Familled_Android_Projet_CORRIGE.zip -d android-project

      - name: Trouver le projet et compiler
        run: |
          SETTINGS=$(find android-project -name settings.gradle -o -name settings.gradle.kts | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "Erreur : settings.gradle introuvable"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS")
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Enregistrer le fichier APK
        uses: actions/upload-artifact@v4
        with:
          name: Familled-APK
          path: android-project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
