
name: Construire APK Familled

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Construire l'application Android
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le projet
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Préparer Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "SDK Android disponible"

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extraire le projet Android
        run: |
          mkdir -p android-project
          ZIP=$(find . -maxdepth 2 -type f -iname '*android*.zip' | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERREUR : Archive Android introuvable"
            exit 1
          fi

          echo "Archive trouvée : $ZIP"
          unzip -q "$ZIP" -d android-project

      - name: Trouver et compiler le projet
        run: |
          cd android-project

          WRAPPER=$(find . -name gradlew -type f | head -n 1)

          if [ -n "$WRAPPER" ]; then
            PROJECT_DIR=$(dirname "$WRAPPER")
            cd "$PROJECT_DIR"
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            SETTINGS=$(find . \( -name settings.gradle -o -name settings.gradle.kts \) -type f | head -n 1)

            if [ -z "$SETTINGS" ]; then
              echo "ERREUR : Projet Gradle introuvable"
              exit 1
            fi

            PROJECT_DIR=$(dirname "$SETTINGS")
            cd "$PROJECT_DIR"
            gradle assembleDebug
          fi

      - name: Enregistrer le fichier APK
        uses: actions/upload-artifact@v4
        with:
          name: Familled-APK
          path: android-project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
