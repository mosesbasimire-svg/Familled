name: Construire APK Android

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer les fichiers
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extraire le projet Android depuis le ZIP
        shell: bash
        run: |
          set -e
          ZIP="Familled_Android_Projet.zip"
          if [ ! -f "$ZIP" ]; then
            echo "ERREUR: $ZIP est introuvable à la racine du dépôt."
            ls -la
            exit 1
          fi
          rm -rf android_project
          mkdir android_project
          unzip -q "$ZIP" -d android_project
          echo "Contenu extrait :"
          find android_project -maxdepth 4 -type f | sort | head -200
          SETTINGS=$(find android_project -name settings.gradle -o -name settings.gradle.kts | head -1)
          if [ -z "$SETTINGS" ]; then
            echo "ERREUR: aucun settings.gradle trouvé dans le ZIP."
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "Projet Gradle trouvé dans: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Installer Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Générer l'APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          gradle :app:assembleDebug --stacktrace

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: Notre-Famille-APK
          path: '**/app/build/outputs/apk/debug/app-debug.apk'
          if-no-files-found: error
