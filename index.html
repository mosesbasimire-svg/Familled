<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b2744">
<title>Famille Déo Vumilia Buuma & Francine Sirire</title>
<style>
:root{--navy:#0b2744;--blue:#123f68;--gold:#e7b84b;--cream:#fffaf0;--bg:#f3f6f9;--text:#172433;--muted:#697789;--green:#19a957;--red:#d33}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
button,input,textarea{font:inherit}button{cursor:pointer}.top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:11px 15px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800}.small{font-size:11px;opacity:.8}
.hero{min-height:250px;background:linear-gradient(90deg,#071c31dd,#071c3150),url("famille-banner.jpg") center/cover;display:flex;align-items:end;padding:28px 18px;color:#fff;border-bottom:5px solid var(--gold)}.hero h1{font:800 clamp(32px,8vw,62px) Georgia,serif;margin:0}.hero p{margin:7px 0;font-size:15px}.wrap{max-width:1200px;margin:auto;padding:15px}
.section{background:#fff;border-radius:17px;margin:16px 0;box-shadow:0 4px 18px #00000010;overflow:hidden}.head{background:var(--blue);color:#fff;padding:12px 15px;display:flex;align-items:center;justify-content:space-between;gap:8px}.head button{background:var(--gold);border:0;border-radius:10px;padding:8px 12px;font-weight:800}.members{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:13px;padding:14px}.member{border:1px solid #e1e7ed;border-radius:15px;padding:12px;text-align:center}.avatar{width:105px;height:105px;border-radius:50%;object-fit:cover;border:4px solid var(--gold);display:block;margin:auto;cursor:zoom-in;background:#e8edf2}.member h3{font-size:15px;margin:8px 0 3px}.role{font-size:12px;color:var(--muted);margin-bottom:9px}.actions{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}.btn{border:1px solid #d8e0e8;background:#fff;border-radius:9px;padding:7px 9px;font-size:12px}.primary{background:#1976d2;color:#fff;border-color:#1976d2}.danger{color:var(--red)}.content{padding:14px}.post,.memory{border:1px solid #e0e6ec;border-radius:14px;padding:13px;margin-bottom:13px}.postTop{display:flex;gap:9px;align-items:center}.mini{width:43px;height:43px;border-radius:50%;object-fit:cover;border:2px solid var(--gold)}.postTop strong{display:block}.muted{font-size:12px;color:var(--muted)}.postText{white-space:pre-wrap;line-height:1.55;margin:11px 0}.postImg,.memory img{width:100%;max-height:540px;object-fit:cover;border-radius:11px;cursor:zoom-in}.reactions{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.react{border:0;border-radius:18px;padding:6px 9px;background:#f1f4f7}.react.active{outline:2px solid var(--gold);background:#fff6d9}.comments{border-top:1px solid #edf0f3;padding-top:9px}.comment{padding:8px 0;border-bottom:1px solid #edf0f3}.commentForm{display:flex;gap:6px;margin-top:8px}.commentForm input{flex:1;min-width:0;padding:9px;border:1px solid #d8e0e8;border-radius:9px}.memoryGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.memory h4{margin:8px 0 3px}.whatsapp{display:block;text-align:center;text-decoration:none;background:var(--green);color:#fff;font-weight:800;padding:14px;border-radius:12px;margin:16px 0}.empty{text-align:center;padding:25px;color:var(--muted)}
.modal{display:none;position:fixed;inset:0;background:#000b;z-index:100;align-items:center;justify-content:center;padding:14px}.modal.show{display:flex}.box{background:#fff;border-radius:17px;padding:18px;width:min(620px,100%);max-height:90vh;overflow:auto}.box input,.box textarea{width:100%;padding:10px;border:1px solid #d8e0e8;border-radius:9px;margin:6px 0 12px}.row{display:flex;gap:8px;justify-content:flex-end}.row button{padding:9px 13px;border:0;border-radius:9px}.save{background:#1976d2;color:#fff}.close{background:#e9eef2}.light img{max-width:100%;max-height:82vh;border-radius:12px}.login{position:fixed;inset:0;background:linear-gradient(135deg,#071c31,#1c527f);z-index:200;display:flex;align-items:center;justify-content:center;padding:18px}.loginBox{background:#fff;width:min(400px,100%);border-radius:20px;padding:25px;text-align:center}.loginBox img{width:105px;height:105px;border-radius:50%;object-fit:cover;border:4px solid var(--gold)}.loginBox input{width:100%;padding:12px;border:1px solid #d8e0e8;border-radius:10px;margin:12px 0}.loginBox button{width:100%;padding:12px;border:0;border-radius:10px;background:var(--navy);color:#fff;font-weight:800}.error{color:var(--red);min-height:19px;font-size:13px}
@media(max-width:600px){.wrap{padding:9px}.members{grid-template-columns:repeat(2,1fr);gap:8px;padding:9px}.member{padding:8px}.avatar{width:82px;height:82px}.hero{min-height:220px;padding:20px 15px}.section{margin:11px 0}.head{font-size:13px}.head button{padding:7px 9px}.content{padding:9px}}
</style>
</head>
<body>
<div id="login" class="login"><div class="loginBox"><img src="famille-banner.jpg"><h2>Bienvenue dans notre famille</h2><p>Accès familial</p><input id="pass" type="password" placeholder="Mot de passe"><div id="err" class="error"></div><button onclick="login()">Entrer</button></div></div>
<header class="top"><div class="brand">👨‍👩‍👧‍👦 Notre Famille</div><div class="small">Version complète de test</div></header>
<section class="hero"><div><h1>Notre Famille</h1><p><b>DEO VUMILIA BUUMA & FRANCINE SIRIRE</b></p><p><i>Une famille, une histoire, une génération, un héritage.</i></p></div></section>
<main class="wrap">
<section class="section"><div class="head"><span>👨‍👩‍👧‍👦 Membres <span id="count"></span></span></div><div id="members" class="members"></div></section>
<section class="section"><div class="head"><span>📝 Publications</span><button onclick="newPost()">＋ Publier</button></div><div id="posts" class="content"></div></section>
<section class="section"><div class="head"><span>🖼️ Souvenirs</span><button onclick="newMemory()">＋ Ajouter</button></div><div id="memories" class="content"></div></section>
<a class="whatsapp" href="https://chat.whatsapp.com/BA3yagA7oK6Ciaz51xmvo" target="_blank">💬 Rejoindre le groupe WhatsApp familial</a>
</main>
<div id="modal" class="modal"><div id="box" class="box"></div></div>
<div id="light" class="modal light" onclick="closeLight()"><img id="lightImg"></div>
<script>
const members=[
["Déo Vumilia Buuma","Père","26/12/1972","Père de la famille, gradué en sciences de l'éducation et enseignant dans une école secondaire."],
["Sirire Masirika Francine","Mère","01/03/1978","Mère de la famille, commerçante et cultivatrice."],
["Ameshinda Vumilia Alliance","Fils aîné","03/11/1996","Fils aîné de la famille. Il est décédé célibataire, après avoir atteint le niveau de Bac 2 en management. Que son âme repose en paix."],
["Salama Namwangasa Yvette","2e enfant","14/07/2000","Infirmière, graduée de l'Institut Supérieur des Techniques Médicales de Bukavu. Elle est mariée à Justin Ushindi."],
["Buuma Vumilia Benjamin","3e fils","10/05/2002","Laborantin, licencié en laboratoire de l'Institut Supérieur des Techniques Médicales de Bukavu."],
["ATUKUZWE Vumilia Jonathan","4e fils","22/05/2005","Informaticien, licencié de l'Institut Supérieur Pédagogique de Bukavu."],
["Basimire Vumilia Moïse","5e fils","18/09/2007","Économiste, licencié de l'Université Officielle de Bukavu."],
["Barikiwa Vumilia Angélique","6e fille","20/03/2010","Commercialiste de l'Institut Kando."],
["Bwaashi Vumilia Gloire","7e fils","16/09/2012","Commercialiste de l'Institut Kando."],
["Chisiki Vumilia Bien-aimé","8e fils","16/10/2014","Histoire à compléter…"],
["Furaha Vumilia Noela","9e fille","26/12/2016","Histoire à compléter…"],
["Asifiwe Vumilia Victoire","10e enfant — cadet","07/07/2018","Cadet de la famille."]
];
let photos=JSON.parse(localStorage.getItem("deo_photos")||"{}");
let posts=JSON.parse(localStorage.getItem("deo_posts")||"null")||[{id:"p0",author:0,date:new Date().toLocaleString("fr-FR"),text:"Bienvenue dans notre espace familial ! Partageons ici nos nouvelles, nos photos et nos souvenirs.",image:"",reactions:{},comments:[]}];
let memories=JSON.parse(localStorage.getItem("deo_memories")||"[]");
const me=6;
const save=()=>{localStorage.setItem("deo_photos",JSON.stringify(photos));localStorage.setItem("deo_posts",JSON.stringify(posts));localStorage.setItem("deo_memories",JSON.stringify(memories))};
function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function avatar(i){return photos[i]||"data:image/svg+xml;charset=UTF-8,"+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><rect width="100%" height="100%" fill="#e8edf2"/><text x="50%" y="58%" text-anchor="middle" font-size="82" fill="#123f68">${members[i][0][0]}</text></svg>`)}
function renderMembers(){count.textContent="("+members.length+")";membersEl.innerHTML=members.map((m,i)=>`<article class="member"><img class="avatar" src="${avatar(i)}" onclick="light('${avatar(i)}')"><h3>${esc(m[0])}</h3><div class="role">${esc(m[1])}</div><div class="actions"><button class="btn primary" onclick="photo(${i})">📷 ${photos[i]?"Changer":"Ajouter"}</button><button class="btn" onclick="info(${i})">ℹ️ Profil</button></div></article>`).join("")}
const membersEl=document.getElementById("members");
function photo(i){let x=document.createElement("input");x.type="file";x.accept="image/*";x.onchange=()=>{let f=x.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{photos[i]=r.result;save();renderMembers()};r.readAsDataURL(f)};x.click()}
function info(i){let m=members[i];modal(`<h2>${esc(m[0])}</h2><p><b>${esc(m[1])}</b> · ${esc(m[2])}</p><p>${esc(m[3])}</p><div class="row"><button class="close" onclick="closeModal()">Fermer</button></div>`)}
function renderPosts(){postsEl.innerHTML=posts.length?posts.slice().reverse().map(p=>{let c={};Object.values(p.reactions||{}).forEach(x=>c[x]=(c[x]||0)+1);let rs=["❤️","👍","😂","😢","🙏","🎉"].map(x=>`<button class="react ${p.reactions?.[me]===x?"active":""}" onclick="react('${p.id}','${x}')">${x} ${c[x]||""}</button>`).join("");let cs=(p.comments||[]).map((x,i)=>`<div class="comment"><b>${esc(members[x.author]?.[0]||"Membre")}</b> <span class="muted">${esc(x.date)}</span><div>${esc(x.text)}</div><button class="btn danger" onclick="delComment('${p.id}',${i})">Supprimer</button></div>`).join("");return `<article class="post"><div class="postTop"><img class="mini" src="${avatar(p.author)}"><div><strong>${esc(members[p.author]?.[0])}</strong><span class="muted">${esc(p.date)}</span></div><button class="btn danger" style="margin-left:auto" onclick="delPost('${p.id}')">🗑️</button></div><div class="postText">${esc(p.text)}</div>${p.image?`<img class="postImg" src="${p.image}" onclick="light('${p.image}')">`:""}<div class="reactions">${rs}</div><div class="comments"><b>💬 Commentaires (${(p.comments||[]).length})</b>${cs||'<div class="muted">Aucun commentaire.</div>'}<div class="commentForm"><input id="c${p.id}" placeholder="Écrire un commentaire…"><button class="btn primary" onclick="comment('${p.id}')">Envoyer</button></div></div></article>`}).join(""):'<div class="empty">Aucune publication.</div>'}
const postsEl=document.getElementById("posts");
function react(id,r){let p=posts.find(x=>x.id===id);p.reactions=p.reactions||{};p.reactions[me]=r;save();renderPosts()}
function comment(id){let e=document.getElementById("c"+id);if(!e.value.trim())return;let p=posts.find(x=>x.id===id);p.comments.push({author:me,text:e.value.trim(),date:new Date().toLocaleString("fr-FR")});save();renderPosts()}
function delComment(id,i){posts.find(x=>x.id===id).comments.splice(i,1);save();renderPosts()}
function delPost(id){if(confirm("Supprimer cette publication ?")){posts=posts.filter(x=>x.id!==id);save();renderPosts()}}
function newPost(){modal(`<h2>Nouvelle publication</h2><textarea id="pt" rows="6" placeholder="Écris un message…"></textarea><input id="pf" type="file" accept="image/*"><div class="row"><button class="close" onclick="closeModal()">Annuler</button><button class="save" onclick="addPost()">Publier</button></div>`)}
function addPost(){let t=document.getElementById("pt").value.trim(),f=document.getElementById("pf").files[0];if(!t&&!f)return;let add=im=>{posts.push({id:"p"+Date.now(),author:me,date:new Date().toLocaleString("fr-FR"),text:t,image:im||"",reactions:{},comments:[]});save();closeModal();renderPosts()};if(f){let r=new FileReader();r.onload=()=>add(r.result);r.readAsDataURL(f)}else add("")}
function renderMemories(){memoriesEl.innerHTML=memories.length?'<div class="memoryGrid">'+memories.slice().reverse().map(m=>`<article class="memory"><img src="${m.image}" onclick="light('${m.image}')"><h4>${esc(m.title)}</h4><div class="muted">${esc(m.date)} · ${esc(m.author)}</div><button class="btn danger" onclick="delMemory('${m.id}')">🗑️ Supprimer</button></article>`).join("")+'</div>':'<div class="empty">Aucun souvenir. Ajoute une photo pour commencer.</div>'}
const memoriesEl=document.getElementById("memories");
function newMemory(){modal(`<h2>Ajouter un souvenir</h2><input id="mt" placeholder="Titre du souvenir"><input id="mf" type="file" accept="image/*"><div class="row"><button class="close" onclick="closeModal()">Annuler</button><button class="save" onclick="addMemory()">Ajouter</button></div>`)}
function addMemory(){let t=document.getElementById("mt").value.trim(),f=document.getElementById("mf").files[0];if(!f)return alert("Choisis une photo.");let r=new FileReader();r.onload=()=>{memories.push({id:"m"+Date.now(),title:t||"Souvenir de famille",image:r.result,date:new Date().toLocaleDateString("fr-FR"),author:members[me][0]});save();closeModal();renderMemories()};r.readAsDataURL(f)}
function delMemory(id){if(confirm("Supprimer ce souvenir ?")){memories=memories.filter(x=>x.id!==id);save();renderMemories()}}
function modal(h){box.innerHTML=h;document.getElementById("modal").classList.add("show")}function closeModal(){document.getElementById("modal").classList.remove("show")}function light(src){lightImg.src=src;document.getElementById("light").classList.add("show")}function closeLight(){document.getElementById("light").classList.remove("show")}
function login(){if(pass.value==="DEO"){document.getElementById("login").style.display="none"}else err.textContent="Mot de passe incorrect."}
pass.addEventListener("keydown",e=>{if(e.key==="Enter")login()});
renderMembers();renderPosts();renderMemories();
</script>
</body></html>
