<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b2744">
<title>Notre Famille</title>
<style>
:root{--navy:#0b2744;--blue:#123f68;--gold:#e7b84b;--bg:#f3f6f9;--text:#172433;--muted:#697789;--green:#19a957;--red:#c62828}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}
.top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:11px 15px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800}.small{font-size:11px;opacity:.8}
.hero{min-height:250px;background:linear-gradient(90deg,#071c31dd,#071c3150),url("famille-banner.jpg") center/cover;display:flex;align-items:end;padding:28px 18px;color:#fff;border-bottom:5px solid var(--gold)}.hero h1{font:800 clamp(32px,8vw,62px) Georgia,serif;margin:0}.hero p{margin:7px 0;font-size:15px}
.wrap{max-width:1200px;margin:auto;padding:15px}.section{background:#fff;border-radius:17px;margin:16px 0;box-shadow:0 4px 18px #00000010;overflow:hidden}.head{background:var(--blue);color:#fff;padding:12px 15px;display:flex;align-items:center;justify-content:space-between;gap:8px}.head button{background:var(--gold);border:0;border-radius:10px;padding:8px 12px;font-weight:800}
.members{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:13px;padding:14px}.member{border:1px solid #e1e7ed;border-radius:15px;padding:12px;text-align:center}.avatar{width:105px;height:105px;border-radius:50%;object-fit:cover;border:4px solid var(--gold);display:block;margin:auto;cursor:zoom-in;background:#e8edf2}.member h3{font-size:15px;margin:8px 0 3px}.role{font-size:12px;color:var(--muted);margin-bottom:9px}.actions{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}.btn{border:1px solid #d8e0e8;background:#fff;border-radius:9px;padding:7px 9px;font-size:12px}.primary{background:#1976d2;color:#fff;border-color:#1976d2}.content{padding:14px}.post{border:1px solid #e0e6ec;border-radius:14px;padding:13px;margin-bottom:13px}.postTop{display:flex;gap:9px;align-items:center}.mini{width:43px;height:43px;border-radius:50%;object-fit:cover;border:2px solid var(--gold)}.postTop strong{display:block}.muted{font-size:12px;color:var(--muted)}.postText{white-space:pre-wrap;line-height:1.55;margin:11px 0}.postImg{width:100%;max-height:540px;object-fit:cover;border-radius:11px;cursor:zoom-in}.reactions{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.react{border:0;border-radius:18px;padding:6px 9px;background:#f1f4f7}.react.active{outline:2px solid var(--gold);background:#fff6d9}.comments{border-top:1px solid #edf0f3;padding-top:9px}.comment{padding:8px 0;border-bottom:1px solid #edf0f3}.commentForm{display:flex;gap:6px;margin-top:8px}.commentForm input{flex:1;min-width:0;padding:9px;border:1px solid #d8e0e8;border-radius:9px}.empty{text-align:center;padding:25px;color:var(--muted)}
.modal{display:none;position:fixed;inset:0;background:#000b;z-index:100;align-items:center;justify-content:center;padding:14px}.modal.show{display:flex}.box{background:#fff;border-radius:17px;padding:18px;width:min(620px,100%);max-height:90vh;overflow:auto}.box input,.box textarea{width:100%;padding:10px;border:1px solid #d8e0e8;border-radius:9px;margin:6px 0 12px}.row{display:flex;gap:8px;justify-content:flex-end}.row button{padding:9px 13px;border:0;border-radius:9px}.save{background:#1976d2;color:#fff}.close{background:#e9eef2}.light img{max-width:100%;max-height:82vh;border-radius:12px}.login{position:fixed;inset:0;background:linear-gradient(135deg,#071c31,#1c527f);z-index:200;display:flex;align-items:center;justify-content:center;padding:18px}.loginBox{background:#fff;width:min(400px,100%);border-radius:20px;padding:25px;text-align:center}.loginBox img{width:105px;height:105px;border-radius:50%;object-fit:cover;border:4px solid var(--gold)}.loginBox input{width:100%;padding:12px;border:1px solid #d8e0e8;border-radius:10px;margin:12px 0}.loginBox button{width:100%;padding:12px;border:0;border-radius:10px;background:var(--navy);color:#fff;font-weight:800}.error{color:var(--red);min-height:19px;font-size:13px}.status{font-size:12px;padding:7px 12px;text-align:center;background:#e9f8ef;color:#187443}.status.bad{background:#fff0f0;color:#b22}.whatsapp{display:block;text-align:center;background:#20b95a;color:#fff;padding:12px;border-radius:12px;text-decoration:none;font-weight:800;margin:14px 0}
@media(max-width:600px){.wrap{padding:9px}.members{grid-template-columns:repeat(2,1fr);gap:8px;padding:9px}.member{padding:8px}.avatar{width:82px;height:82px}.hero{min-height:220px;padding:20px 15px}.section{margin:11px 0}.head{font-size:13px}.head button{padding:7px 9px}.content{padding:9px}}
</style>

</head>
<body>
<div id="login" class="login"><div class="loginBox"><img src="famille-banner.jpg" alt="Famille"><h2>Bienvenue dans notre famille</h2><p>Accès familial</p><input id="pass" type="password" placeholder="Mot de passe"><div id="err" class="error"></div><button onclick="login()">Entrer</button></div></div>
<header class="top"><div class="brand">👨‍👩‍👧‍👦 Notre Famille</div><div class="small">Supabase</div></header>
<div id="status" class="status">Connexion à Supabase…</div>
<section class="hero"><div><h1>Notre Famille</h1><p><b>DEO VUMILIA BUUMA & FRANCINE SIRIRE</b></p><p><i>Une famille, une histoire, une génération, un héritage.</i></p></div></section>
<main class="wrap"><section class="section"><div class="head"><span>👨‍👩‍👧‍👦 Membres <span id="count"></span></span></div><div id="members" class="members"></div></section><section class="section"><div class="head"><span>📝 Publications</span><button onclick="newPost()">＋ Publier</button></div><div id="posts" class="content"></div></section><a class="whatsapp" href="https://chat.whatsapp.com/BA3yagA7oK6Ciaz51xmvo" target="_blank" rel="noopener">💬 Rejoindre le groupe WhatsApp familial</a></main>
<div id="modal" class="modal"><div id="box" class="box"></div></div><div id="light" class="modal light" onclick="closeLight()"><img id="lightImg" alt="Image"></div>
<script>
const SUPABASE_URL="https://qhlrbzqlivkaiydfkkqg.supabase.co";
const SUPABASE_KEY="sb_publishable_k-TqofekxbnTFFmajug_lQ_bitz7C_9";
let sb=null;
const FAMILY_NAMES=["Déo Vumilia Buuma","Sirire Masirika Francine","Ameshinda Vumilia Alliance","Salama Namwangasa Yvette","Buuma Vumilia Benjamin","ATUKUZWE Vumilia Jonathan","Basimire Vumilia Moïse","Barikiwa Vumilia Angélique","Bwaashi Vumilia Gloire","Chisiki Vumilia Bien-aimé","Furaha Vumilia Noela","Asifiwe Vumilia Victoire"];
const FAMILY_INFO=[
["Père","26/12/1972","Père de la famille, gradué en sciences de l'éducation et enseignant dans une école secondaire."],["Mère","01/03/1978","Mère de la famille, commerçante et cultivatrice."],["Fils aîné","03/11/1996","Fils aîné de la famille. Il est décédé célibataire, après avoir atteint le niveau de Bac 2 en management."],["2e enfant","14/07/2000","Infirmière, graduée de l'Institut Supérieur des Techniques Médicales de Bukavu. Elle est mariée à Justin Ushindi."],["3e fils","10/05/2002","Laborantin, licencié en laboratoire de l'Institut Supérieur des Techniques Médicales de Bukavu."],["4e fils","22/05/2005","Informaticien, licencié de l'Institut Supérieur Pédagogique de Bukavu."],["5e fils","18/09/2007","Économiste, licencié de l'Université Officielle de Bukavu."],["6e fille","20/03/2010","Commercialiste de l'Institut Kando."],["7e fils","16/09/2012","Commercialiste de l'Institut Kando."],["8e fils","16/10/2014","Histoire à compléter…"],["9e fille","26/12/2016","Histoire à compléter…"],["10e enfant — cadet","07/07/2018","Cadet de la famille."]];
let photos=JSON.parse(localStorage.getItem("deo_photos")||"{}");let currentUser=null,dbMembers=[],posts=[];
const membersEl=document.getElementById("members"),postsEl=document.getElementById("posts");
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function avatar(i){return photos[i]||"data:image/svg+xml;charset=UTF-8,"+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><rect width="100%" height="100%" fill="#e8edf2"/><text x="50%" y="58%" text-anchor="middle" font-size="82" fill="#123f68">${FAMILY_NAMES[i]?.[0]||"M"}</text></svg>`)}
function renderMembers(){document.getElementById("count").textContent="("+FAMILY_NAMES.length+")";membersEl.innerHTML=FAMILY_NAMES.map((n,i)=>`<article class="member"><img class="avatar" src="${avatar(i)}" onclick="light('${avatar(i)}')"><h3>${esc(n)}</h3><div class="role">${esc(FAMILY_INFO[i][0])}</div><div class="actions"><button class="btn primary" onclick="photo(${i})">📷 ${photos[i]?"Changer":"Ajouter"}</button><button class="btn" onclick="info(${i})">ℹ️ Profil</button></div></article>`).join("")}
function photo(i){let x=document.createElement("input");x.type="file";x.accept="image/*";x.onchange=()=>{let f=x.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{photos[i]=r.result;localStorage.setItem("deo_photos",JSON.stringify(photos));renderMembers()};r.readAsDataURL(f)};x.click()}
function info(i){let m=FAMILY_INFO[i];modal(`<h2>${esc(FAMILY_NAMES[i])}</h2><p><b>${esc(m[0])}</b> · ${esc(m[1])}</p><p>${esc(m[2])}</p><div class="row"><button class="close" onclick="closeModal()">Fermer</button></div>`)}
function memberName(id){return dbMembers.find(m=>String(m.id)===String(id))?.name||"Membre"}
function memberIndex(id){let n=memberName(id);return Math.max(0,FAMILY_NAMES.indexOf(n))}
function renderPosts(){if(!posts.length){postsEl.innerHTML='<div class="empty">Aucune publication.</div>';return}postsEl.innerHTML=posts.map(p=>{let counts={};(p.reactions||[]).forEach(x=>counts[x.reaction]=(counts[x.reaction]||0)+1);let mine=(p.reactions||[]).find(x=>String(x.member_id)===String(currentUser?.memberId));let rs=["❤️","👍","😂","😢","🙏","🎉"].map(x=>`<button class="react ${mine?.reaction===x?"active":""}" onclick="react('${p.id}','${x}')">${x} ${counts[x]||""}</button>`).join("");let cs=(p.comments||[]).map(x=>`<div class="comment"><b>${esc(memberName(x.member_id))}</b> <span class="muted">${esc(new Date(x.created_at).toLocaleString("fr-FR"))}</span><div>${esc(x.content)}</div></div>`).join("");return `<article class="post"><div class="postTop"><img class="mini" src="${avatar(memberIndex(p.member_id))}"><div><strong>${esc(memberName(p.member_id))}</strong><span class="muted">${esc(new Date(p.created_at).toLocaleString("fr-FR"))}</span></div></div><div class="postText">${esc(p.content||"")}</div>${p.image_url?`<img class="postImg" src="${esc(p.image_url)}" onclick="light('${esc(p.image_url)}')">`:""}<div class="reactions">${rs}</div><div class="comments"><b>💬 Commentaires (${(p.comments||[]).length})</b>${cs||'<div class="muted">Aucun commentaire.</div>'}<div class="commentForm"><input id="c${p.id}" placeholder="Écrire un commentaire…"><button class="btn primary" onclick="comment('${p.id}')">Envoyer</button></div></div></article>`}).join("")}
async function loadPosts(){if(!sb){posts=[];renderPosts();return}const {data,error}=await sb.from("posts").select("*,comments(*),reactions(*)").order("created_at",{ascending:false});if(error){setStatus("Supabase connecté, mais les publications ne sont pas disponibles.",true);console.error(error);return}posts=data||[];renderPosts()}
async function react(postId,reaction){if(!sb||!currentUser?.memberId){alert("Supabase n’est pas disponible pour le moment.");return;}const {data:old}=await sb.from("reactions").select("id,reaction").eq("post_id",postId).eq("member_id",currentUser.memberId).maybeSingle();let result;if(old&&old.reaction===reaction)result=await sb.from("reactions").delete().eq("id",old.id);else if(old)result=await sb.from("reactions").update({reaction}).eq("id",old.id);else result=await sb.from("reactions").insert({post_id:postId,member_id:currentUser.memberId,reaction});if(result?.error)alert("Réaction impossible.");await loadPosts()}
async function comment(postId){if(!sb||!currentUser?.memberId){alert("Supabase n’est pas disponible pour le moment.");return;}let e=document.getElementById("c"+postId);if(!e||!e.value.trim()||!currentUser?.memberId)return;const {error}=await sb.from("comments").insert({post_id:postId,member_id:currentUser.memberId,content:e.value.trim()});if(error){alert("Impossible d'ajouter le commentaire.");return}e.value="";await loadPosts()}
function newPost(){modal(`<h2>Nouvelle publication</h2><textarea id="pt" rows="6" placeholder="Écris un message…"></textarea><input id="pf" type="file" accept="image/*"><div class="row"><button class="close" onclick="closeModal()">Annuler</button><button class="save" onclick="addPost()">Publier</button></div>`)}
async function addPost(){if(!sb||!currentUser?.memberId){alert("Supabase n’est pas disponible pour le moment.");return;}let t=document.getElementById("pt").value.trim(),f=document.getElementById("pf").files[0];if(!t&&!f)return;if(!currentUser?.memberId)return;let imageUrl=null;if(f){const safe=f.name.replace(/[^a-zA-Z0-9._-]/g,"_");const path=`posts/${currentUser.memberId}/${Date.now()}-${safe}`;const up=await sb.storage.from("Family-media").upload(path,f,{upsert:false});if(up.error){alert("La photo n'a pas pu être envoyée. Vérifie le bucket Family-media.");return}imageUrl=sb.storage.from("Family-media").getPublicUrl(path).data.publicUrl}const {error}=await sb.from("posts").insert({member_id:currentUser.memberId,content:t,image_url:imageUrl});if(error){alert("Publication impossible. Vérifie family_members et les règles RLS.");return}closeModal();await loadPosts()}
function setStatus(text,bad=false){let s=document.getElementById("status");s.textContent=text;s.className="status"+(bad?" bad":"")}
function modal(h){document.getElementById("box").innerHTML=h;document.getElementById("modal").classList.add("show")}function closeModal(){document.getElementById("modal").classList.remove("show")}function light(src){document.getElementById("lightImg").src=src;document.getElementById("light").classList.add("show")}function closeLight(){document.getElementById("light").classList.remove("show")}
function login(){if(document.getElementById("pass").value==="DEO")document.getElementById("login").style.display="none";else document.getElementById("err").textContent="Mot de passe incorrect."}document.getElementById("pass").addEventListener("keydown",e=>{if(e.key==="Enter")login()});
function loadSupabaseLibrary(){return new Promise((resolve,reject)=>{if(window.supabase){resolve();return}const tag=document.createElement("script");tag.src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";tag.async=true;tag.onload=resolve;tag.onerror=()=>reject(new Error("Bibliothèque Supabase inaccessible"));document.head.appendChild(tag);setTimeout(()=>reject(new Error("Délai de connexion dépassé")),10000)})}
async function startSupabase(){try{await loadSupabaseLibrary();sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let session=(await sb.auth.getSession()).data.session;if(!session){const r=await sb.auth.signInAnonymously();if(r.error)throw r.error;session=r.data.session}const q=await sb.from("family_members").select("id,name").order("id");if(q.error)throw q.error;dbMembers=q.data||[];const wanted="Basimire Vumilia Moïse";const mine=dbMembers.find(m=>m.name===wanted)||dbMembers[0];if(!mine)throw new Error("Aucun membre trouvé dans family_members.");currentUser={authId:session.user.id,memberId:mine.id};setStatus("✅ Supabase connecté — publications, commentaires et réactions sont partagés.");await loadPosts()}catch(e){console.error(e);setStatus("⚠️ Site ouvert — Supabase est temporairement indisponible. Le site peut quand même être consulté.",true)}}
renderMembers();startSupabase();
</script>
</body></html>
