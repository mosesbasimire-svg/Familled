<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b2744">
<title>Famille Déo Vumilia Buuma & Francine Sirire</title>
<style>
:root{
  --navy:#0b2744;
  --blue:#123f68;
  --gold:#e7b84b;
  --cream:#fffaf0;
  --bg:#f3f6f9;
  --text:#172433;
  --muted:#697789;
  --green:#19a957;
  --red:#d33
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif
}
button,input,textarea{font:inherit}
button{cursor:pointer}
.top{
  position:sticky;
  top:0;
  z-index:20;
  background:var(--navy);
  color:#fff;
  padding:11px 15px;
  display:flex;
  justify-content:space-between;
  align-items:center
}
.brand{font-weight:800}
.small{font-size:11px;opacity:.8}
.hero{
  min-height:250px;
  background:
    linear-gradient(90deg,#071c31dd,#071c3150),
    url("famille-banner.jpg") center/cover;
  display:flex;
  align-items:end;
  padding:28px 18px;
  color:#fff;
  border-bottom:5px solid var(--gold)
}
.hero h1{
  font:800 clamp(32px,8vw,62px) Georgia,serif;
  margin:0
}
.hero p{margin:7px 0;font-size:15px}
.wrap{max-width:1200px;margin:auto;padding:15px}
.section{
  background:#fff;
  border-radius:17px;
  margin:16px 0;
  box-shadow:0 4px 18px #00000010;
  overflow:hidden
}
.head{
  background:var(--blue);
  color:#fff;
  padding:12px 15px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px
}
.head button{
  background:var(--gold);
  border:0;
  border-radius:10px;
  padding:8px 12px;
  font-weight:800
}
.members{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
  gap:13px;
  padding:14px
}
.member{
  border:1px solid #e1e7ed;
  border-radius:15px;
  padding:12px;
  text-align:center
}
.avatar{
  width:105px;
  height:105px;
  border-radius:50%;
  object-fit:cover;
  border:4px solid var(--gold);
  display:block;
  margin:auto;
  cursor:zoom-in;
  background:#e8edf2
}
.member h3{font-size:15px;margin:8px 0 3px}
.role{font-size:12px;color:var(--muted);margin-bottom:9px}
.actions{
  display:flex;
  justify-content:center;
  gap:6px;
  flex-wrap:wrap
}
.btn{
  border:1px solid #d8e0e8;
  background:#fff;
  border-radius:9px;
  padding:7px 9px;
  font-size:12px
}
.primary{background:#1976d2;color:#fff;border-color:#1976d2}
.danger{color:var(--red)}
.content{padding:14px}
.post,.memory{
  border:1px solid #e0e6ec;
  border-radius:14px;
  padding:13px;
  margin-bottom:13px
}
.postTop{display:flex;gap:9px;align-items:center}
.mini{
  width:43px;
  height:43px;
  border-radius:50%;
  object-fit:cover;
  border:2px solid var(--gold)
}
.postTop strong{display:block}
.muted{font-size:12px;color:var(--muted)}
.postText{white-space:pre-wrap;line-height:1.55;margin:11px 0}
.postImg,.memory img{
  width:100%;
  max-height:540px;
  object-fit:cover;
  border-radius:11px;
  cursor:zoom-in
}
.reactions{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  margin:10px 0
}
.react{
  border:0;
  border-radius:18px;
  padding:6px 9px;
  background:#f1f4f7
}
.react.active{
  outline:2px solid var(--gold);
  background:#fff6d9
}
.comments{
  border-top:1px solid #edf0f3;
  padding-top:9px
}
.comment{
  padding:8px 0;
  border-bottom:1px solid #edf0f3
}
.commentForm{display:flex;gap:6px;margin-top:8px}
.commentForm input{
  flex:1;
  min-width:0;
  padding:9px;
  border:1px solid #d8e0e8;
  border-radius:9px
}
.memoryGrid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:12px
}
.memory h4{margin:8px 0 3px}
.whatsapp{
  display:block;
  text-align:center;
  text-decoration:none;
  background:var(--green);
  color:#fff;
  font-weight:800;
  padding:14px;
  border-radius:12px;
  margin:16px 0
}
.empty{text-align:center;padding:25px;color:var(--muted)}
.modal{
  display:none;
  position:fixed;
  inset:0;
  background:#000b;
  z-index:100;
  align-items:center;
  justify-content:center;
  padding:14px
}
.modal.show{display:flex}
.box{
  background:#fff;
  border-radius:17px;
  padding:18px;
  width:min(620px,100%);
  max-height:90vh;
  overflow:auto
}
.box input,.box textarea{
  width:100%;
  padding:10px;
  border:1px solid #d8e0e8;
  border-radius:9px;
  margin:6px 0 12px
}
.row{display:flex;gap:8px;justify-content:flex-end}
.row button{
  padding:9px 13px;
  border:0;
  border-radius:9px
}
.save{background:#1976d2;color:#fff}
.close{background:#e9eef2}
.light img{
  max-width:100%;
  max-height:82vh;
  border-radius:12px
}
.login{
  position:fixed;
  inset:0;
  background:linear-gradient(135deg,#071c31,#1c527f);
  z-index:200;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px
}
.loginBox{
  background:#fff;
  width:min(400px,100%);
  border-radius:20px;
  padding:25px;
  text-align:center
}
.loginBox img{
  width:105px;
  height:105px;
  border-radius:50%;
  object-fit:cover;
  border:4px solid var(--gold)
}
.loginBox input{
  width:100%;
  padding:12px;
  border:1px solid #d8e0e8;
  border-radius:10px;
  margin:12px 0
}
.loginBox button{
  width:100%;
  padding:12px;
  border:0;
  border-radius:10px;
  background:var(--navy);
  color:#fff;
  font-weight:800
}
.error{color:var(--red);min-height:19px;font-size:13px}
@media(max-width:600px){
  .wrap{padding:9px}
  .members{
    grid-template-columns:repeat(2,1fr);
    gap:8px;
    padding:9px
  }
  .member{padding:8px}
  .avatar{width:82px;height:82px}
  .hero{min-height:220px;padding:20px 15px}
  .section{margin:11px 0}
  .head{font-size:13px}
  .head button{padding:7px 9px}
  .content{padding:9px}
}
</style>
</head>
<body>

<div id="login" class="login">
  <div class="loginBox">
    <img src="famille-banner.jpg" alt="Famille">
    <h2>Bienvenue dans notre famille</h2>
    <p>Accès familial</p>
    <input id="pass" type="password" placeholder="Mot de passe">
    <div id="err" class="error"></div>
    <button onclick="login()">Entrer</button>
  </div>
</div>

<header class="top">
  <div class="brand">👨‍👩‍👧‍👦 Notre Famille</div>
  <div class="small">Version complète de test</div>
</header>

<section class="hero">
  <div>
    <h1>Notre Famille</h1>
    <p><b>DEO VUMILIA BUUMA & FRANCINE SIRIRE</b></p>
    <p><i>Une famille, une histoire, une génération, un héritage.</i></p>
  </div>
</section>

<main class="wrap">
  <section class="section">
    <div class="head">
      <span>👨‍👩‍👧‍👦 Membres <span id="count"></span></span>
    </div>
    <div id="members" class="members"></div>
  </section>

  <section class="section">
    <div class="head">
      <span>📝 Publications</span>
      <button onclick="newPost()">＋ Publier</button>
    </div>
    <div id="posts" class="content"></div>
  </section>

  <section class="section">
    <div class="head">
      <span>🖼️ Souvenirs</span>
      <button onclick="newMemory()">＋ Ajouter</button>
    </div>
    <div id="memories" class="content"></div>
  </section>

  <a class="whatsapp" href="https://chat.whatsapp.com/BA3yagA7oK6Ciaz51xmvo" target="_blank">
    💬 Rejoindre le groupe WhatsApp familial
  </a>
</main>

<div id="modal" class="modal">
  <div id="box" class="box"></div>
</div>

<div id="light" class="modal light" onclick="closeLight()">
  <img id="lightImg" alt="Image">
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://qhlrbzqlivkaiydfkkqg.supabase.co";
const SUPABASE_KEY="sb_publishable_k-TqofekxbnTFFmajug_lQ_bitz7C_9";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const members=[
  ["Déo Vumilia Buuma","Père","26/12/1972","Père de la famille, gradué en sciences de l'éducation et enseignant dans une école secondaire."],
  ["Sirire Masirika Francine","Mère","01/03/1978","Mère de la famille, commerçante et cultivatrice."],
  ["Ameshinda Vumilia Alliance","Fils aîné","03/11/1996","Fils aîné de la famille. Il est décédé célibataire, après avoir atteint le niveau de Bac 2 en management. Que son âme repose en paix."],
  ["Salama Namwangasa Yvette","2e enfant","14/07/2000","Infirmière, graduée de l'Institut Supérieur des Techniques Médicales de Bukavu. Elle est mariée à Justin Ushindi."],
  ["Buuma Vumilia Benjamin","3e fils","10/05/2002","Laborantin, licencié en laboratoire de l'Institut Supérieur des Techniques Médicales de Bukavu."],
  ["ATUKUZWE Vumilia Jonathan","4e fils","22/05/2005","Informaticien, licencié de l'Institut Supérieur Pédagogique de Bukavu."],
  ["Basimire Vumilia Moïse","5e fils","18/09/2007","Économiste, licencié de l'Université Officielle de Bukavu."],
  ["Barikiwa Vumilia Angélique","6e fille","20/03/2010","Commercialiste de l'Institut Kando."],
  ["Bwaashi Vumilia Gloire","7e fils","16/09/2012","Commercialiste de l'Institut Kando."],
  ["Chisiki Vumilia Bien-aimé","8e fils","16/10/2014","Histoire à compléter…"],
  ["Furaha Vumilia Noela","9e fille","26/12/2016","Histoire à compléter…"],
  ["Asifiwe Vumilia Victoire","10e enfant — cadet","07/07/2018","Cadet de la famille."]
];

let memberRows=[];
let photos=JSON.parse(localStorage.getItem("deo_photos")||"{}");
let posts=[];
let memories=JSON.parse(localStorage.getItem("deo_memories")||"[]");
const me=6;
let currentMemberId=null;
let ready=false;

function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function avatar(i){return photos[i]||"data:image/svg+xml;charset=UTF-8,"+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><rect width="100%" height="100%" fill="#e8edf2"/><text x="50%" y="58%" text-anchor="middle" font-size="82" fill="#123f68">${members[i][0][0]}</text></svg>`);}
function saveLocal(){localStorage.setItem("deo_photos",JSON.stringify(photos));localStorage.setItem("deo_memories",JSON.stringify(memories));}

const membersEl=document.getElementById("members");
const postsEl=document.getElementById("posts");
const memoriesEl=document.getElementById("memories");

async function initSupabase(){
  try{
    let {data:{session}}=await sb.auth.getSession();
    if(!session){
      const r=await sb.auth.signInAnonymously();
      if(r.error) throw r.error;
    }
    const {data,error}=await sb.from("family_members").select("id,name").order("id");
    if(error) throw error;
    memberRows=data||[];
    for(const m of members){
      if(!memberRows.some(x=>x.name===m[0])){
        const r=await sb.from("family_members").insert({name:m[0]}).select("id,name").single();
        if(r.error) throw r.error;
        memberRows.push(r.data);
      }
    }
    currentMemberId=memberRows.find(x=>x.name===members[me][0])?.id||null;
    await loadPosts();
    renderMembers();
    renderPosts();
    renderMemories();
    ready=true;
  }catch(e){
    console.error(e);
    postsEl.innerHTML=`<div class="empty">Connexion Supabase non activée. Active l'authentification anonyme dans Supabase, puis recharge le site.</div>`;
    renderMembers();
    renderMemories();
  }
}

async function loadPosts(){
  const [pr,cr,rr]=await Promise.all([
    sb.from("posts").select("id,member_id,content,image_url,created_at").order("created_at",{ascending:false}),
    sb.from("comments").select("id,post_id,member_id,content,created_at").order("created_at",{ascending:true}),
    sb.from("reactions").select("id,post_id,member_id,reaction,created_at").order("created_at",{ascending:true})
  ]);
  if(pr.error) throw pr.error;
  if(cr.error) throw cr.error;
  if(rr.error) throw rr.error;
  const commentsBy={}; (cr.data||[]).forEach(c=>(commentsBy[c.post_id]??=[]).push(c));
  const reactionsBy={}; (rr.data||[]).forEach(r=>((reactionsBy[r.post_id]??=[]).push(r)));
  posts=(pr.data||[]).map(p=>({
    id:p.id, author:Math.max(0,memberRows.findIndex(m=>m.id===p.member_id)), member_id:p.member_id,
    date:new Date(p.created_at).toLocaleString("fr-FR"), text:p.content||"", image:p.image_url||"",
    comments:(commentsBy[p.id]||[]).map(c=>({id:c.id,author:Math.max(0,memberRows.findIndex(m=>m.id===c.member_id)),member_id:c.member_id,text:c.content,date:new Date(c.created_at).toLocaleString("fr-FR")})),
    reactions:(reactionsBy[p.id]||[]).reduce((a,r)=>{a[r.member_id]=r.reaction;return a},{}), reactionRows:reactionsBy[p.id]||[]
  }));
}

function renderMembers(){
  count.textContent="("+members.length+")";
  membersEl.innerHTML=members.map((m,i)=>`<article class="member"><img class="avatar" src="${avatar(i)}" onclick="light('${avatar(i)}')" alt="${esc(m[0])}"><h3>${esc(m[0])}</h3><div class="role">${esc(m[1])}</div><div class="actions"><button class="btn primary" onclick="photo(${i})">📷 ${photos[i]?"Changer":"Ajouter"}</button><button class="btn" onclick="info(${i})">ℹ️ Profil</button></div></article>`).join("");
}

function photo(i){
  const x=document.createElement("input"); x.type="file"; x.accept="image/*";
  x.onchange=()=>{const f=x.files[0]; if(!f)return; const r=new FileReader(); r.onload=()=>{photos[i]=r.result;saveLocal();renderMembers()};r.readAsDataURL(f)}; x.click();
}
function info(i){const m=members[i];modal(`<h2>${esc(m[0])}</h2><p><b>${esc(m[1])}</b> · ${esc(m[2])}</p><p>${esc(m[3])}</p><div class="row"><button class="close" onclick="closeModal()">Fermer</button></div>`)}

function renderPosts(){
  postsEl.innerHTML=posts.length?posts.slice().reverse().map(p=>{
    const c={}; Object.values(p.reactions||{}).forEach(x=>c[x]=(c[x]||0)+1);
    const rs=["❤️","👍","😂","😢","🙏","🎉"].map(x=>`<button class="react ${p.reactions?.[currentMemberId]===x?"active":""}" onclick="react('${p.id}','${x}')">${x} ${c[x]||""}</button>`).join("");
    const cs=(p.comments||[]).map((x,i)=>`<div class="comment"><b>${esc(members[x.author]?.[0]||"Membre")}</b> <span class="muted">${esc(x.date)}</span><div>${esc(x.text)}</div></div>`).join("");
    return `<article class="post"><div class="postTop"><img class="mini" src="${avatar(p.author)}" alt=""><div><strong>${esc(members[p.author]?.[0]||"Membre")}</strong><span class="muted">${esc(p.date)}</span></div></div><div class="postText">${esc(p.text)}</div>${p.image?`<img class="postImg" src="${p.image}" onclick="light('${p.image}')" alt="Publication">`:""}<div class="reactions">${rs}</div><div class="comments"><b>💬 Commentaires (${(p.comments||[]).length})</b>${cs||'<div class="muted">Aucun commentaire.</div>'}<div class="commentForm"><input id="c${p.id}" placeholder="Écrire un commentaire…"><button class="btn primary" onclick="comment('${p.id}')">Envoyer</button></div></div></article>`;
  }).join(""):'<div class="empty">Aucune publication. Ajoute la première publication.</div>';
}

async function react(id,r){
  if(!ready||!currentMemberId)return;
  const p=posts.find(x=>String(x.id)===String(id)); if(!p)return;
  const {error}=await sb.from("reactions").insert({post_id:p.id,member_id:currentMemberId,reaction:r});
  if(error){alert("Réaction impossible : "+error.message);return}
  await loadPosts();renderPosts();
}

async function comment(id){
  if(!ready||!currentMemberId)return;
  const e=document.getElementById("c"+id);if(!e||!e.value.trim())return;
  const {error}=await sb.from("comments").insert({post_id:Number(id),member_id:currentMemberId,content:e.value.trim()});
  if(error){alert("Commentaire impossible : "+error.message);return}
  e.value="";await loadPosts();renderPosts();
}

function newPost(){modal(`<h2>Nouvelle publication</h2><textarea id="pt" rows="6" placeholder="Écris un message…"></textarea><input id="pf" type="file" accept="image/*"><div class="row"><button class="close" onclick="closeModal()">Annuler</button><button class="save" onclick="addPost()">Publier</button></div>`)}

async function uploadImage(file){
  const ext=(file.name.split(".").pop()||"jpg").toLowerCase();
  const path=`posts/${Date.now()}-${Math.random().toString(36).slice(2)}.${ext}`;
  const {error}=await sb.storage.from("Family-media").upload(path,file,{upsert:false,contentType:file.type});
  if(error)throw error;
  const {data}=sb.storage.from("Family-media").getPublicUrl(path);
  return data.publicUrl;
}

async function addPost(){
  if(!ready||!currentMemberId)return alert("Supabase n'est pas encore connecté.");
  const t=document.getElementById("pt").value.trim(); const f=document.getElementById("pf").files[0]; if(!t&&!f)return;
  try{
    let image_url=""; if(f) image_url=await uploadImage(f);
    const {error}=await sb.from("posts").insert({member_id:currentMemberId,content:t,image_url}).select().single();
    if(error)throw error;
    closeModal();await loadPosts();renderPosts();
  }catch(e){alert("Publication impossible : "+e.message)}
}

function renderMemories(){
  memoriesEl.innerHTML=memories.length?'<div class="memoryGrid">'+memories.slice().reverse().map(m=>`<article class="memory"><img src="${m.image}" onclick="light('${m.image}')" alt="${esc(m.title)}"><h4>${esc(m.title)}</h4><div class="muted">${esc(m.date)} · ${esc(m.author)}</div><button class="btn danger" onclick="delMemory('${m.id}')">🗑️ Supprimer</button></article>`).join("")+'</div>':'<div class="empty">Aucun souvenir. Ajoute une photo pour commencer.</div>';
}
function newMemory(){modal(`<h2>Ajouter un souvenir</h2><input id="mt" placeholder="Titre du souvenir"><input id="mf" type="file" accept="image/*"><div class="row"><button class="close" onclick="closeModal()">Annuler</button><button class="save" onclick="addMemory()">Ajouter</button></div>`)}
function addMemory(){const t=document.getElementById("mt").value.trim(),f=document.getElementById("mf").files[0];if(!f)return alert("Choisis une photo.");const r=new FileReader();r.onload=()=>{memories.push({id:"m"+Date.now(),title:t||"Souvenir de famille",image:r.result,date:new Date().toLocaleDateString("fr-FR"),author:members[me][0]});saveLocal();closeModal();renderMemories()};r.readAsDataURL(f)}
function delMemory(id){if(confirm("Supprimer ce souvenir ?")){memories=memories.filter(x=>x.id!==id);saveLocal();renderMemories()}}
function modal(h){box.innerHTML=h;document.getElementById("modal").classList.add("show")}
function closeModal(){document.getElementById("modal").classList.remove("show")}
function light(src){lightImg.src=src;document.getElementById("light").classList.add("show")}
function closeLight(){document.getElementById("light").classList.remove("show")}
function login(){if(pass.value==="DEO"){document.getElementById("login").style.display="none";initSupabase()}else err.textContent="Mot de passe incorrect."}
pass.addEventListener("keydown",e=>{if(e.key==="Enter")login()});
renderMembers();renderMemories();
</script>
</body>
</html>
