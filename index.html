<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b2744">
<title>Notre Famille</title>
<style>
:root{--navy:#0b2744;--blue:#123f68;--gold:#e7b84b;--bg:#f3f6f9;--text:#172433;--muted:#697789}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}
.top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:11px 15px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800}.small{font-size:11px;opacity:.8}
.status{text-align:center;padding:8px 12px;background:#e9f8ef;color:#187443;font-size:13px}.status.bad{background:#fff0f0;color:#b22}
.hero{min-height:250px;background:linear-gradient(90deg,#071c31dd,#071c3150),url("famille-banner.jpg") center/cover;display:flex;align-items:end;padding:28px 18px;color:#fff;border-bottom:5px solid var(--gold)}.hero h1{font:800 clamp(32px,8vw,62px) Georgia,serif;margin:0}.hero p{margin:7px 0;font-size:15px}
.wrap{max-width:1200px;margin:auto;padding:15px}.section{background:#fff;border-radius:17px;margin:16px 0;box-shadow:0 4px 18px #0001;overflow:hidden}.head{background:var(--blue);color:#fff;padding:12px 15px;display:flex;align-items:center;justify-content:space-between}.head button{background:var(--gold);border:0;border-radius:10px;padding:8px 12px;font-weight:800}
.members{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:13px;padding:14px}.member{border:1px solid #e1e7ed;border-radius:15px;padding:12px;text-align:center}.avatar{width:105px;height:105px;border-radius:50%;object-fit:cover;border:4px solid var(--gold);display:block;margin:auto;background:#e8edf2}.member h3{font-size:15px;margin:8px 0 3px}.role,.muted,.hint{font-size:12px;color:var(--muted)}.actions{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}.btn{border:1px solid #d8e0e8;background:#fff;border-radius:9px;padding:7px 9px;font-size:12px}.primary{background:#1976d2;color:#fff;border-color:#1976d2}
.content{padding:14px}.post{border:1px solid #e0e6ec;border-radius:14px;padding:13px;margin-bottom:13px}.postTop{display:flex;gap:9px;align-items:center}.mini{width:43px;height:43px;border-radius:50%;object-fit:cover;border:2px solid var(--gold)}.postTop strong{display:block}.postText{white-space:pre-wrap;line-height:1.55;margin:11px 0}.postImg{width:100%;max-height:540px;object-fit:cover;border-radius:11px}.reactions{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.react{border:0;border-radius:18px;padding:6px 9px;background:#f1f4f7}.react.active{outline:2px solid var(--gold);background:#fff6d9}.comments{border-top:1px solid #edf0f3;padding-top:9px}.comment{padding:8px 0;border-bottom:1px solid #edf0f3}.commentForm{display:flex;gap:6px;margin-top:8px}.commentForm input{flex:1;min-width:0;padding:9px;border:1px solid #d8e0e8;border-radius:9px}.empty{text-align:center;padding:25px;color:var(--muted)}
.modal{display:none;position:fixed;inset:0;background:#000b;z-index:100;align-items:center;justify-content:center;padding:14px}.modal.show{display:flex}.box{background:#fff;border-radius:17px;padding:18px;width:min(620px,100%);max-height:90vh;overflow:auto}.box input,.box textarea{width:100%;padding:10px;border:1px solid #d8e0e8;border-radius:9px;margin:6px 0 12px}.row{display:flex;gap:8px;justify-content:flex-end}.row button{padding:9px 13px;border:0;border-radius:9px}.save{background:#1976d2;color:#fff}.close{background:#e9eef2}.login{position:fixed;inset:0;background:linear-gradient(135deg,#071c31,#1c527f);z-index:200;display:flex;align-items:center;justify-content:center;padding:18px}.loginBox{background:#fff;width:min(400px,100%);border-radius:20px;padding:25px;text-align:center}.loginBox img{width:105px;height:105px;border-radius:50%;object-fit:cover;border:4px solid var(--gold)}.loginBox input{width:100%;padding:12px;border:1px solid #d8e0e8;border-radius:10px;margin:12px 0}.loginBox button{width:100%;padding:12px;border:0;border-radius:10px;background:var(--navy);color:#fff;font-weight:800}.error{color:#c62828;min-height:19px;font-size:13px}.whatsapp{display:block;text-align:center;background:#20b95a;color:#fff;padding:12px;border-radius:12px;text-decoration:none;font-weight:800;margin:14px 0}
@media(max-width:600px){.wrap{padding:9px}.members{grid-template-columns:repeat(2,1fr);gap:8px;padding:9px}.member{padding:8px}.avatar{width:82px;height:82px}.hero{min-height:220px;padding:20px 15px}.section{margin:11px 0}.content{padding:9px}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div id="login" class="login"><div class="loginBox"><img src="famille-banner.jpg" alt="Famille"><h2>Bienvenue dans notre famille</h2><p>Accès familial</p><input id="pass" type="password" placeholder="Mot de passe"><div id="err" class="error"></div><button onclick="login()">Entrer</button></div></div>
<header class="top"><div class="brand">👨‍👩‍👧‍👦 Notre Famille</div><div class="small">Supabase</div></header>
<div id="status" class="status">Connexion à Supabase…</div>
<section class="hero"><div><h1>Notre Famille</h1><p><b>DEO VUMILIA BUUMA & FRANCINE SIRIRE</b></p><p><i>Une famille, une histoire, une génération, un héritage.</i></p></div></section>
<main class="wrap">
<section class="section"><div class="head"><span>👨‍👩‍👧‍👦 Membres <span id="count"></span></span></div><div id="members" class="members"></div></section>
<section class="section"><div class="head"><span>📝 Publications</span><button onclick="newPost()">＋ Publier</button></div><div id="posts" class="content"></div></section>
<a class="whatsapp" href="https://chat.whatsapp.com/BA3yagA7oK6Ciaz51xmvo" target="_blank">💬 Rejoindre le groupe WhatsApp familial</a>
</main>
<div id="modal" class="modal"><div id="box" class="box"></div></div>
<script>
const URL="https://qhlrbzqlivkaiydfkkqg.supabase.co",KEY="sb_publishable_k-TqofekxbnTFFmajug_lQ_bitz7C_9";
const sb=supabase.createClient(URL,KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
const N=["Déo Vumilia Buuma","Sirire Masirika Francine","Ameshinda Vumilia Alliance","Salama Namwangasa Yvette","Buuma Vumilia Benjamin","ATUKUZWE Vumilia Jonathan","Basimire Vumilia Moïse","Barikiwa Vumilia Angélique","Bwaashi Vumilia Gloire","Chisiki Vumilia Bien-aimé","Furaha Vumilia Noela","Asifiwe Vumilia Victoire"];
const I=[["Père","26/12/1972"],["Mère","01/03/1978"],["Fils aîné","03/11/1996"],["2e enfant","14/07/2000"],["3e fils","10/05/2002"],["4e fils","22/05/2005"],["5e fils","18/09/2007"],["6e fille","20/03/2010"],["7e fils","16/09/2012"],["8e fils","16/10/2014"],["9e fille","26/12/2016"],["10e enfant — cadet","07/07/2018"]];
let members=[],posts=[],me=null;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fallback=i=>"data:image/svg+xml;charset=UTF-8,"+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><rect width="100%" height="100%" fill="#e8edf2"/><text x="50%" y="58%" text-anchor="middle" font-size="82" fill="#123f68">${N[i][0]}</text></svg>`);
const avatar=i=>members[i]?.profile_url||fallback(i);
function status(t,bad=false){let e=document.getElementById("status");e.textContent=t;e.className="status"+(bad?" bad":"")}
function renderMembers(){document.getElementById("count").textContent="("+N.length+")";document.getElementById("members").innerHTML=N.map((n,i)=>`<article class="member"><img class="avatar" src="${esc(avatar(i))}"><h3>${esc(n)}</h3><div class="role">${esc(I[i][0])}</div><div class="actions"><button class="btn primary" onclick="changePhoto(${i})">📷 ${members[i]?.profile_url?"Changer":"Ajouter"}</button><button class="btn" onclick="profile(${i})">ℹ️ Profil</button></div></article>`).join("")}
function compress(file,max=1800,q=.82){return new Promise((ok,no)=>{let r=new FileReader(),im=new Image();r.onload=()=>{im.onload=()=>{let s=Math.min(1,max/Math.max(im.width,im.height)),w=Math.round(im.width*s),h=Math.round(im.height*s),c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(im,0,0,w,h);c.toBlob(b=>b?ok(b):no(Error("compression")), "image/jpeg",q)};im.src=r.result};r.onerror=no;r.readAsDataURL(file)})}
async function changePhoto(i){let f=document.createElement("input");f.type="file";f.accept="image/*";f.onchange=async()=>{if(!f.files[0])return;try{status("📸 Compression et envoi de la photo…");let b=await compress(f.files[0],1600,.82),path=`profiles/${members[i].id}.jpg`;let u=await sb.storage.from("Family-media").upload(path,b,{upsert:true,contentType:"image/jpeg"});if(u.error)throw u.error;let url=sb.storage.from("Family-media").getPublicUrl(path).data.publicUrl;let x=await sb.from("family_members").update({profile_url:url}).eq("id",members[i].id);if(x.error)throw x.error;members[i].profile_url=url+"?v="+Date.now();renderMembers();status("✅ Photo de profil enregistrée et partagée.");}catch(e){alert("Photo refusée : "+e.message);status("❌ Photo de profil impossible.",true)}};f.click()}
function profile(i){document.getElementById("box").innerHTML=`<h2>${esc(N[i])}</h2><p><b>${esc(I[i][0])}</b> · ${esc(I[i][1])}</p><div class="row"><button class="close" onclick="closeModal()">Fermer</button></div>`;document.getElementById("modal").classList.add("show")}
function newPost(){document.getElementById("box").innerHTML=`<h2>Nouvelle publication</h2><textarea id="txt" rows="6" placeholder="Écris un message…"></textarea><input id="file" type="file" accept="image/*"><div class="hint">Les grandes photos sont automatiquement compressées.</div><div id="prog" class="hint"></div><div class="row"><button class="close" onclick="closeModal()">Annuler</button><button class="save" onclick="publish()">Publier</button></div>`;document.getElementById("modal").classList.add("show")}
async function publish(){let text=document.getElementById("txt").value.trim(),f=document.getElementById("file").files[0];if(!text&&!f)return;try{let url=null;if(f){document.getElementById("prog").textContent="📸 Compression…";let b=await compress(f);document.getElementById("prog").textContent="☁️ Envoi…";let path=`posts/${me.id}/${Date.now()}.jpg`,u=await sb.storage.from("Family-media").upload(path,b,{upsert:false,contentType:"image/jpeg"});if(u.error)throw u.error;url=sb.storage.from("Family-media").getPublicUrl(path).data.publicUrl}document.getElementById("prog").textContent="💾 Enregistrement…";let x=await sb.from("posts").insert({member_id:me.id,content:text,image_url:url});if(x.error)throw x.error;closeModal();await loadPosts();status("✅ Publication partagée avec la famille.");}catch(e){alert("Publication impossible : "+e.message)}}
async function loadPosts(){let x=await sb.from("posts").select("*,comments(*),reactions(*)").order("created_at",{ascending:false});if(x.error){status("❌ Publications indisponibles : "+x.error.message,true);return}posts=x.data||[];renderPosts()}
function renderPosts(){let el=document.getElementById("posts");if(!posts.length){el.innerHTML='<div class="empty">Aucune publication.</div>';return}el.innerHTML=posts.map(p=>{let r={};(p.reactions||[]).forEach(a=>r[a.reaction]=(r[a.reaction]||0)+1);let mine=(p.reactions||[]).find(a=>String(a.member_id)===String(me?.id));let buttons=["❤️","👍","😂","😢","🙏","🎉"].map(a=>`<button class="react ${mine?.reaction===a?"active":""}" onclick="react(${p.id},'${a}')">${a} ${r[a]||""}</button>`).join("");let comments=(p.comments||[]).map(c=>`<div class="comment"><b>${esc(members.find(m=>m.id===c.member_id)?.name||"Membre")}</b> <span class="muted">${new Date(c.created_at).toLocaleString("fr-FR")}</span><div>${esc(c.content)}</div></div>`).join("");let mi=Math.max(0,N.indexOf(members.find(m=>m.id===p.member_id)?.name));return `<article class="post"><div class="postTop"><img class="mini" src="${esc(avatar(mi))}"><div><strong>${esc(members.find(m=>m.id===p.member_id)?.name||"Membre")}</strong><span class="muted">${new Date(p.created_at).toLocaleString("fr-FR")}</span></div></div><div class="postText">${esc(p.content||"")}</div>${p.image_url?`<img class="postImg" src="${esc(p.image_url)}">`:""}<div class="reactions">${buttons}</div><div class="comments"><b>💬 Commentaires (${(p.comments||[]).length})</b>${comments||'<div class="muted">Aucun commentaire.</div>'}<div class="commentForm"><input id="c${p.id}" placeholder="Écrire un commentaire…"><button class="btn primary" onclick="comment(${p.id})">Envoyer</button></div></div></article>`}).join("")}
async function react(pid,emoji){let x=await sb.from("reactions").select("id,reaction").eq("post_id",pid).eq("member_id",me.id);if(x.error)return alert(x.error.message);let old=x.data?.[0],r=old?(old.reaction===emoji?await sb.from("reactions").delete().eq("id",old.id):await sb.from("reactions").update({reaction:emoji}).eq("id",old.id)):await sb.from("reactions").insert({post_id:pid,member_id:me.id,reaction:emoji});if(r.error)alert("Réaction impossible : "+r.error.message);await loadPosts()}
async function comment(pid){let e=document.getElementById("c"+pid);if(!e.value.trim())return;let x=await sb.from("comments").insert({post_id:pid,member_id:me.id,content:e.value.trim()});if(x.error)return alert("Commentaire impossible : "+x.error.message);e.value="";await loadPosts()}
function closeModal(){document.getElementById("modal").classList.remove("show")}
function login(){if(document.getElementById("pass").value==="DEO")document.getElementById("login").style.display="none";else document.getElementById("err").textContent="Mot de passe incorrect."}
document.getElementById("pass").addEventListener("keydown",e=>{if(e.key==="Enter")login()});
async function start(){try{status("🔐 Connexion sécurisée à Supabase…");let a=await Promise.race([sb.auth.signInAnonymously(),new Promise((_,rej)=>setTimeout(()=>rej(Error("Délai de connexion dépassé. Vérifie la connexion Internet ou Supabase Anonymous Sign-Ins.")),12000))]);if(a.error)throw a.error;status("📥 Chargement des membres…");let x=await sb.from("family_members").select("id,name,profile_url").order("id");if(x.error)throw x.error;members=x.data||[];if(!members.length)throw Error("La table family_members est vide.");me=members.find(m=>m.name==="Basimire Vumilia Moïse")||members[0];renderMembers();status("✅ Supabase connecté — publications, commentaires et réactions sont partagés.");await loadPosts()}catch(e){console.error(e);document.getElementById("members").innerHTML=`<div class="empty">❌ ${esc(e.message)}<br><button class="btn primary" onclick="location.reload()">Réessayer</button></div>`;status("❌ Connexion Supabase impossible",true)}}
renderMembers();document.getElementById("members").innerHTML="<div class="empty">⏳ Chargement des membres…</div>";document.getElementById("posts").innerHTML="<div class="empty">⏳ Chargement des publications…</div>";start();
</script>
</body></html>
